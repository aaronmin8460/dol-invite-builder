<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>돌잔치 초대장 생성기</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; background:#fff7f7; margin:0; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 20px; }
    .card { background:#fff; border:1px solid #eee; border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.06); padding:16px; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    label { display:block; font-weight:600; margin-top:10px; }
    input[type="text"], input[type="url"], input[type="file"], select {
      width:100%; padding:10px; border-radius:12px; border:1px solid #ddd; box-sizing:border-box; background:#fff;
    }
    .btns { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
    button { padding:12px 16px; border-radius:12px; border:1px solid #e5e7eb; background:#fff; cursor:pointer; font-weight:600; }
    button.primary { background:#111827; color:#fff; border-color:#111827; }
    button:disabled { opacity:.5; cursor:not-allowed; }

    .preview { margin-top:14px; background:#f8fafc; border:1px dashed #e5e7eb; border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:12px; }

    /* ✅ 미리보기 이미지 영역 + 버튼 오버레이 */
    .preview-hero { width:100%; height:420px; position:relative; border-radius:12px; overflow:hidden; background:#fff; }
    .preview-hero img { width:100%; height:100%; object-fit:cover; display:block; }

    /* ✅ “마음보내기(CTA)” 버튼: 모바일에서 너무 위로 뜨지 않게 bottom 값 낮춤 */
    .ctaBtn{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      bottom: clamp(10px, 2.4vw, 18px);

      font-size: clamp(14px, 4.2vw, 18px);
      padding: clamp(10px, 3.0vw, 13px) clamp(22px, 8.5vw, 40px);

      border-radius:999px;
      border:none;
      background:#ff5a3c;
      color:#fff;
      font-weight:800;
      box-shadow:0 10px 24px rgba(255,90,60,.30);
      cursor:pointer;
      letter-spacing:-0.3px;
      white-space: nowrap;
      max-width: calc(100% - 32px);
    }
    .ctaBtn:active { transform:translateX(-50%) scale(0.99); }

    .muted { color:#6b7280; font-size:13px; text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>돌잔치 초대장 생성기</h1>
      <p class="muted">카톡 미리보기 제목/설명을 직접 지정할 수 있습니다.</p>

      <div class="row">
        <div>
          <label>카톡 미리보기 제목</label>
          <input id="ogTitle" type="text" placeholder="예: 준우의 첫 돌잔치에 초대합니다" />
        </div>
        <div>
          <label>카톡 미리보기 설명</label>
          <input id="ogDesc" type="text" placeholder="예: 10/12(일) 낮 1시 · 아빠 홍길동 · 엄마 홍길순" />
        </div>
      </div>

      <!-- ✅ 버튼 포함 여부 + 송금 안내 섹션 표시 여부 -->
      <div class="row">
        <div>
          <label>초대장 HTML에 “마음보내기” 버튼</label>
          <select id="ctaMode">
            <option value="on" selected>포함</option>
            <option value="off">미포함</option>
          </select>
        </div>
        <div>
          <label>버튼 텍스트</label>
          <input id="ctaText" type="text" placeholder="예: 마음보내기" value="마음보내기" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>하단 “송금 안내” 섹션</label>
          <select id="paySectionMode">
            <option value="on" selected>표시</option>
            <option value="off">표시안함</option>
          </select>
        </div>
        <div>
          <label>(설명) 버튼은 항상 “첫 번째 계좌 복사”</label>
          <input type="text" value="CTA 버튼 클릭 → 첫 번째 유효 계좌정보 복사" disabled />
        </div>
      </div>

      <div class="row">
        <div>
          <label>상단 사진 (필수)</label>
          <input id="top" type="file" accept="image/*" />
        </div>
        <div>
          <label>하단 사진 (선택)</label>
          <input id="bottom" type="file" accept="image/*" />
        </div>
      </div>

      <label>카카오톡 썸네일 이미지 (선택, 1200×630)</label>
      <input id="thumb" type="file" accept="image/*" />

      <h2 style="margin-top:20px;">송금 정보 (최대 4개)</h2>
      <div id="accountInputs" style="display:flex;flex-direction:column;gap:10px;margin-top:10px;"></div>

      <div class="btns">
        <button id="previewBtn">미리보기</button>
        <button id="zipBtn" class="primary" disabled>ZIP 만들기</button>
      </div>

      <div class="preview" id="preview">
        <div class="preview-hero"><div class="muted">여기에 미리보기</div></div>
        <h2 id="previewMainTitle" style="text-align:center"></h2>
        <p id="previewSubTitle" class="muted"></p>
      </div>

      <p class="muted" style="margin-top:10px;">
        ※ copy.png / kakaopay.png 파일은 이 HTML과 같은 폴더에 있어야 ZIP 생성 시 같이 포함됩니다.
      </p>
    </div>
  </div>

  <canvas id="cv" style="display:none"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
