<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>돌잔치 초대장 생성기</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; background:#fff7f7; margin:0; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 20px; }
    .card { background:#fff; border:1px solid #eee; border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.06); padding:16px; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    label { display:block; font-weight:600; margin-top:10px; }
    input[type="text"], input[type="url"], input[type="file"] { width:100%; padding:10px; border-radius:12px; border:1px solid #ddd; }
    .btns { display:flex; gap:10px; margin-top:14px; }
    button { padding:12px 16px; border-radius:12px; border:1px solid #e5e7eb; background:#fff; cursor:pointer; font-weight:600; }
    button.primary { background:#111827; color:#fff; border-color:#111827; }
    .preview { margin-top:14px; background:#f8fafc; border:1px dashed #e5e7eb; border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:12px; }
    .preview-hero { width:100%; height:420px; display:flex; align-items:center; justify-content:center; border-radius:12px; overflow:hidden; }
    .preview-hero img { max-width:100%; max-height:100%; object-fit:contain; }
    .muted { color:#6b7280; font-size:13px; text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>돌잔치 초대장 생성기</h1>
      <p class="muted">카톡 미리보기 제목/설명을 직접 지정할 수 있습니다.</p>

      <div class="row">
        <div>
          <label>카톡 미리보기 제목</label>
          <input id="ogTitle" type="text" placeholder="예: 준우의 첫 돌잔치에 초대합니다" />
        </div>
        <div>
          <label>카톡 미리보기 설명</label>
          <input id="ogDesc" type="text" placeholder="예: 10/12(일) 낮 1시 · 아빠 홍길동 · 엄마 홍길순" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>상단 사진 (필수)</label>
          <input id="top" type="file" accept="image/*" />
        </div>
        <div>
          <label>하단 사진 (선택)</label>
          <input id="bottom" type="file" accept="image/*" />
        </div>
      </div>

      <label>카카오톡 썸네일 이미지 (선택, 1200×630)</label>
      <input id="thumb" type="file" accept="image/*" />

      <!-- 계좌 입력 필드 -->
      <h2 style="margin-top:20px;">💳 계좌 정보 (최대 4개)</h2>
      <p class="muted">입력하지 않으면 자동으로 숨겨집니다.</p>
      <div id="accountInputs" style="display:flex;flex-direction:column;gap:10px;margin-top:10px;"></div>

      <div class="btns">
        <button id="previewBtn">미리보기</button>
        <button id="zipBtn" class="primary" disabled>ZIP 만들기</button>
      </div>

      <!-- PREVIEW -->
      <div class="preview" id="preview">
        <div class="preview-hero"><div class="muted">여기에 미리보기</div></div>
        <h2 id="previewMainTitle" style="text-align:center"></h2>
        <p id="previewSubTitle" class="muted"></p>
      </div>
    </div>
  </div>

  <canvas id="cv" style="display:none"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <script>
  window.addEventListener('DOMContentLoaded', () => {
    const $ = (id) => document.getElementById(id);
    const cv = $("cv"), ctx = cv.getContext("2d");
    let mergedDataUrl = "";

    // 계좌 입력 필드 4개 생성
    for (let i = 0; i < 4; i++) {
      const div = document.createElement("div");
      div.classList.add("row");
      div.innerHTML = `
        <div>
          <label>받는 사람 이름 ${i+1}</label>
          <input id="accName${i}" type="text" placeholder="예: 민병일" />
        </div>
        <div>
          <label>계좌번호 및 은행 ${i+1}</label>
          <input id="accBank${i}" type="text" placeholder="예: 신한 110497044856" />
        </div>
        <div style="grid-column:1/3;">
          <label>카카오페이 송금 URL ${i+1}</label>
          <input id="accUrl${i}" type="url" placeholder="예: https://qr.kakaopay.com/Ej9GLFeXd" />
        </div>`;
      $("accountInputs").appendChild(div);
    }

    // 파일 → 이미지 변환
    function fileToImage(fileOrBlob) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = r.result; };
        r.onerror = rej; r.readAsDataURL(fileOrBlob);
      });
    }
    function dataURLToBlob(dataURL) {
      const arr = dataURL.split(','), mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]); let n = bstr.length; const u8 = new Uint8Array(n);
      while(n--) u8[n] = bstr.charCodeAt(n);
      return new Blob([u8], { type: mime });
    }
    function drawCover(srcImg, w, h) {
      const sw = srcImg.width, sh = srcImg.height;
      const sr = sw/sh, dr = w/h;
      let sx, sy, sW, sH;
      if (sr > dr) { sH = sh; sW = sH*dr; sx = (sw-sW)/2; sy = 0; }
      else { sW = sw; sH = sW/dr; sx = 0; sy = (sh-sH)/2; }
      cv.width = w; cv.height = h;
      ctx.clearRect(0,0,w,h);
      ctx.drawImage(srcImg, sx, sy, sW, sH, 0, 0, w, h);
      return cv.toDataURL('image/jpeg', 0.9);
    }
    async function mergeVerticallyOptional(fileTop, fileBottom) {
      if (fileTop && !fileBottom) {
        const i = await fileToImage(fileTop);
        return i.src;
      }
      if (!fileTop && fileBottom) {
        const i = await fileToImage(fileBottom);
        return i.src;
      }
      const i1 = await fileToImage(fileTop);
      const i2 = await fileToImage(fileBottom);
      const w = Math.max(i1.width, i2.width);
      const h1 = Math.round(i1.height * (w / i1.width));
      const h2 = Math.round(i2.height * (w / i2.width));
      cv.width = w; cv.height = h1 + h2;
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height);
      ctx.drawImage(i1, 0, 0, i1.width, i1.height, 0, 0, w, h1);
      ctx.drawImage(i2, 0, 0, i2.width, i2.height, 0, h1, w, h2);
      return cv.toDataURL('image/png');
    }
    function escapeHtml(s='') {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                      .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
                      .replace(/'/g,'&#39;');
    }

    function renderAccountsToHTML() {
      let html = "";
      for (let i = 0; i < 4; i++) {
        const name = $(`accName${i}`).value.trim();
        const bank = $(`accBank${i}`).value.trim();
        const url = $(`accUrl${i}`).value.trim();
        if (!name || !bank) continue;
        html += `
        <div style="display:flex;justify-content:space-between;align-items:center;background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:10px 14px;margin-top:8px;">
          <div><strong>${escapeHtml(name)}</strong><br><span style="font-size:14px;color:#374151">${escapeHtml(bank)}</span></div>
          <div style="display:flex;gap:8px;align-items:center;">
            ${url ? `<img src="./junwoo1.png" style="height:36px;cursor:pointer;" onclick="window.open('${escapeHtml(url)}','_blank')">` : ""}
            <img src="./junwoo2.png" style="height:36px;cursor:pointer;" onclick="navigator.clipboard.writeText('${escapeHtml(bank)}').then(()=>alert('${escapeHtml(bank)} 복사됨'))">
          </div>
        </div>`;
      }
      return html;
    }

    async function onPreviewClick(){
      const f1 = $("top").files[0], f2 = $("bottom").files[0];
      if (!f1 && !f2) { alert('상단 사진을 선택하세요.'); return; }
      mergedDataUrl = await mergeVerticallyOptional(f1, f2);

      const hero = $("preview").querySelector(".preview-hero");
      hero.innerHTML = "";
      const img = new Image(); img.src = mergedDataUrl; hero.appendChild(img);

      $("previewMainTitle").innerText = $("ogTitle").value || "초대장";
      $("previewSubTitle").innerText = $("ogDesc").value || "초대합니다.";

      // 계좌 미리보기
      const existing = document.getElementById("accountPreview");
      if (existing) existing.remove();
      const wrapper = document.createElement("div");
      wrapper.id = "accountPreview";
      const list = renderAccountsToHTML();
      wrapper.innerHTML = list ? `<h3 style="text-align:center;">💳 계좌 안내</h3>${list}` : "";
      $("preview").appendChild(wrapper);

      $("zipBtn").disabled = false;
    }

    async function onZipClick(){
      if (!mergedDataUrl) { alert('먼저 미리보기를 해주세요.'); return; }
      const ogTitle = $("ogTitle").value || "초대장";
      const ogDesc  = $("ogDesc").value  || "초대합니다.";

      let thumbDataUrl = '';
      const thumbFile = $("thumb").files[0];
      if (thumbFile) {
        const thImg = await fileToImage(thumbFile);
        thumbDataUrl = drawCover(thImg, 1200, 630);
      } else {
        const mImg = await fileToImage(dataURLToBlob(mergedDataUrl));
        thumbDataUrl = drawCover(mImg, 1200, 630);
      }

      const accountHTML = renderAccountsToHTML();
      const inviteHtml = `<!doctype html><html lang="ko"><head>
<meta property="og:title" content="${escapeHtml(ogTitle)}">
<meta property="og:description" content="${escapeHtml(ogDesc)}">
<meta property="og:type" content="website">
<meta property="og:image" content="./thumb_1200x630.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${escapeHtml(ogTitle)}</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;background:#fff7f7;margin:0;padding:16px}
.wrap{max-width:820px;margin:0 auto}
.card{background:#fff;border:1px solid #eee;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.06);overflow:hidden}
.hero{width:100%;display:block}
</style>
</head><body>
<div class="wrap"><div class="card">
  <img class="hero" src="./merged.png" alt="${escapeHtml(ogTitle)}">
  ${accountHTML ? `<div style="padding:16px;"><h3 style="text-align:center;">💳 계좌 안내</h3>${accountHTML}</div>` : ""}
</div></div>
</body></html>`;

      const zip = new JSZip();
      zip.file("index.html", inviteHtml);
      zip.file("merged.png", dataURLToBlob(mergedDataUrl));
      zip.file("thumb_1200x630.jpg", dataURLToBlob(thumbDataUrl));

      const blob = await zip.generateAsync({ type: 'blob' });
      saveAs(blob, `${ogTitle}_초대장.zip`);
    }

    $("previewBtn").addEventListener("click", onPreviewClick);
    $("zipBtn").addEventListener("click", onZipClick);
  });
  </script>
</body>
</html>
